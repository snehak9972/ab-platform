name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint with flake8 (errors only, non-blocking style)
        run: |
          flake8 src --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: false

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=ab_platform --cov-report=term-missing

      - name: Smoke test CLI end-to-end
        run: |
          python -m ab_platform simulate
          python -m ab_platform analyze
          python -m ab_platform sample-size --baseline 0.34
